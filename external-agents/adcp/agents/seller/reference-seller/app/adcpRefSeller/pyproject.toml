[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adcpRefSeller"
version = "0.1.0"
description = "AdCP reference test seller agent, deployed as an AgentCore MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "adcp==6.6.0",
    "boto3==1.43.56",
    "pyjwt==2.13.0",
    "python-dotenv==1.1.1",
    # NFR-U3-6/U3 code generation: this seller becomes an MCP *client* for the first time (calling
    # the governance agent's check_governance), so httpx/mcp move from adcp's transitive pins to
    # explicit direct dependencies, per SECURITY-10's exact-pin convention. Versions pinned to what
    # adcp==6.6.0 already resolves transitively (checked against the installed venv, not guessed).
    "httpx==0.28.1",
    "mcp==1.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "moto==5.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
